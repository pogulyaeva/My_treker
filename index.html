<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер привычек</title>
<style>
:root{font-family:Arial,sans-serif;color:#344633;background:#504337}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:4vh 3vw;background:repeating-linear-gradient(115deg,#504236,#504236 3px,#55463a 4px,#55463a 7px);display:grid;place-items:center}button,select,input{font:inherit}button,select{cursor:pointer}.book{width:min(1400px,100%);min-height:90vh;border-radius:28px;background:#f8f3e9;box-shadow:0 18px 45px #24190f99,0 0 0 8px #b58c60;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}.page{padding:35px 48px;background-color:#faf6ec;background-image:linear-gradient(#e9d9b4 1px,transparent 1px),linear-gradient(90deg,#e9d9b4 1px,transparent 1px);background-size:32px 32px}.left{border-right:1px solid #d6c5a3}.right{padding-left:55px;perspective:1200px}.rings{position:absolute;left:50%;top:4%;height:92%;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:space-around;z-index:3;pointer-events:none}.rings i{width:54px;height:13px;border:1px solid #333;border-radius:12px;background:linear-gradient(#fff,#aaa 35%,#222 75%,#777);box-shadow:0 4px 7px #0006}.title{display:inline-block;background:#d5b58a;border:1px solid #ba9565;border-radius:15px;padding:15px 23px;box-shadow:0 4px 8px #60411d28;letter-spacing:.04em;font-size:26px;font-weight:700}.quote{margin:24px 0;background:#f9ebc8;border:1px solid #e3bf6b;border-radius:14px;padding:19px;font:italic 22px Georgia;color:#81532f}.section{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #adbb9e;padding:8px 0 14px;text-transform:uppercase;gap:8px}.primary{background:#4c6045;color:white;border:0;border-radius:9px;padding:9px 14px}.habits{list-style:none;margin:0;padding:0}.habits li{height:55px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5d8c0}.num{background:#d8bb90;color:#4a3e2e;min-width:29px;height:29px;display:grid;place-items:center;border-radius:50%;font-size:13px}.name{flex:1;font-weight:600}.icon{border:0;background:none;color:#907f6d;padding:5px}.del{color:#c2796c}.progress{background:#eee7d7;border:1px solid #d9bc8b;border-radius:15px;padding:17px;margin-top:24px}.progress header{display:flex;justify-content:space-between;align-items:center}.progress strong{font-size:24px}.bar{height:11px;background:#faf6ed;border:1px solid #d4b889;border-radius:20px;margin-top:12px;overflow:hidden}.bar span{display:block;height:100%;background:#788c66;border-radius:20px}.small{font-size:13px;color:#777d68;margin-top:8px}.nav{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#eee7d7;border:1px solid #d9bc8b;border-radius:14px;padding:8px}.nav button,.date select{background:#faf6ed;border:1px solid #d5b789;color:#40513a;border-radius:9px;padding:9px}.date{display:flex;gap:6px;margin:20px 0 12px}.date select{min-width:0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.day{height:72px;padding:10px 0;border-bottom:1px solid #aaaf97;font-weight:bold}.day small{display:block;font-size:12px;color:#74816f;text-transform:uppercase}.day b{font-size:21px}.cell{height:55px;display:grid;place-items:center;border-bottom:1px solid #e5d8c0}.check{width:31px;height:31px;border-radius:50%;border:2px solid #d4ad73;background:#faf6ed;color:white;font-size:19px}.check.on{background:#768b68;border-color:#768b68}.summary{background:#eee7d7;font-weight:bold;padding:12px 0;font-size:13px}.footer{margin-top:22px;text-align:right;font:italic 18px Georgia;color:#705d49}.flip{animation:flip .55s ease}@keyframes flip{0%{transform:rotateY(0);filter:brightness(1)}45%{transform:rotateY(-35deg);filter:brightness(.82)}100%{transform:rotateY(0);filter:brightness(1)}}dialog{border:1px solid #d0b48a;border-radius:18px;background:#faf6ed;color:#344633;padding:25px;box-shadow:0 15px 60px #0006;max-width:90vw}dialog::backdrop{background:#30251eb0}dialog form{display:grid;gap:15px}dialog input{padding:12px;border:1px solid #cbb58f;border-radius:8px;min-width:250px}dialog .actions{display:flex;justify-content:end;gap:8px}.notice{text-align:center;font-size:12px;color:#6f6c60;margin:14px 0 0}@media(max-width:800px){body{padding:20px 14px}.book{min-height:0;display:block;border-radius:22px}.page{padding:24px 20px}.left{border:0}.right{padding-top:0}.rings{display:none}.title{font-size:21px}.quote{font-size:18px;margin:16px 0}.habits li{height:auto;min-height:48px}.mobile-grid{overflow-x:auto}.grid{min-width:430px}.check{width:34px;height:34px}.date{margin-top:12px}.nav{font-size:13px}.nav button{padding:8px}.progress{margin-top:14px}}@media(prefers-reduced-motion:reduce){.flip{animation:none}}

@media(min-width:801px){body{height:100vh;min-height:0;overflow:hidden;padding:0}.book{min-height:0;flex:none;zoom:var(--fit,1);width:min(1400px,calc(94vw / var(--fit,1)));}.page{padding-top:25px;padding-bottom:25px}.quote{margin:14px 0}.habits li,.cell{height:48px}.progress{margin-top:14px}.date{margin:14px 0 8px}}
.book{perspective:2200px}.turning-sheet{position:absolute;z-index:5;top:0;bottom:0;width:50%;pointer-events:none;transform-style:preserve-3d;box-shadow:0 8px 22px #30241555}.turning-sheet.forward{left:50%;transform-origin:left center;animation:turn-forward .9s ease-in-out forwards}.turning-sheet.backward{left:0;transform-origin:right center;animation:turn-backward .9s ease-in-out forwards}.turning-sheet .sheet-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background-color:#faf6ec;background-image:linear-gradient(#e9d9b4 1px,transparent 1px),linear-gradient(90deg,#e9d9b4 1px,transparent 1px);background-size:32px 32px;border-radius:0 25px 25px 0}.turning-sheet .sheet-back{transform:rotateY(180deg);background-color:#f1e7d4;box-shadow:inset -35px 0 45px #72553822}.turning-sheet .sheet-face>.page{height:100%;width:100%}@keyframes turn-forward{0%{transform:rotateY(0deg)}100%{transform:rotateY(-180deg)}}@keyframes turn-backward{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}@media(max-width:800px){.turning-sheet{width:100%;top:50%;bottom:0}.turning-sheet.forward,.turning-sheet.backward{left:0;transform-origin:left center}}

.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.topline .date{margin:0;flex-wrap:wrap;justify-content:flex-end}@media(max-width:800px){.topline{flex-wrap:wrap}.topline .date{justify-content:flex-start}}

.page,.turning-sheet .sheet-face{background-image:none}.date-right{display:flex;justify-content:center;align-items:center;margin:0;min-height:72px}.habits li,.cell{border-bottom-color:#ded2bd}@media(max-width:800px){.date-right{min-height:0;margin:0 0 16px;justify-content:center}}
</style></head><body><main class="book"><div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><section class="page left"><div class="topline"><div class="title">📖 ТРЕКЕР<br>ПРИВЫЧЕК</div></div><div class="quote">«Маленькие шаги к большим изменениям»</div><div class="section"><span>Мои привычки <span id="count"></span></span><button class="primary" id="add">+ Добавить привычку</button></div><ol class="habits" id="habits"></ol><div class="progress"><header><span>ПРОГРЕСС ЗА НЕДЕЛЮ</span><strong id="percentage">0%</strong></header><div class="bar"><span id="bar"></span></div><div class="small" id="total"></div></div><p class="notice">Данные хранятся только в этом браузере. Синхронизация пока не подключена.</p></section><section class="page right" id="page"><div class="date date-right"><select id="month" aria-label="Месяц"></select><select id="year" aria-label="Год"></select><button class="icon" id="today">Сегодня</button></div><div class="nav"><button id="prev">Назад</button><span id="week"></span><button id="next">Вперёд</button></div><div class="mobile-grid"><div class="grid" id="grid"></div></div><div class="footer" id="foot"></div></section></main><dialog id="dialog"><form method="dialog" id="form"><strong id="dialogTitle">Новая привычка</strong><input id="habitInput" maxlength="100" required placeholder="Название привычки"><div class="actions"><button value="cancel">Отмена</button><button class="primary" value="save">Сохранить</button></div></form></dialog>
<script>
const defaults=['Утренняя зарядка','Обед в 12 часов','Дорожка 15 мин','Ужин в 18 часов','Дорожка 15 мин','Вода по норме','Отсутствие перекусов и срывов','Ложиться спать до 24-х часов','Сон 8 часов'];const key='notebook-habits-v1';let data;try{data=JSON.parse(localStorage.getItem(key));if(!data||!Array.isArray(data.habits)||!data.marks)throw 0}catch{data={habits:defaults.map((name,i)=>({id:'default-'+i,name})),marks:{}}}let current=monday(new Date()),editing=null;const $=id=>document.getElementById(id);function monday(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dayAt(i){let d=new Date(current);d.setDate(d.getDate()+i);return d}function save(){localStorage.setItem(key,JSON.stringify(data))}function pct(n,d){return d?Math.round(n/d*10000)/100:0}function fmt(n){return String(n).replace('.',',')+'%'}function render(){const h=$('habits'),g=$('grid');h.replaceChildren();g.replaceChildren();$('count').textContent='('+data.habits.length+')';data.habits.forEach((habit,i)=>{let li=document.createElement('li'),num=document.createElement('span'),name=document.createElement('span'),edit=document.createElement('button'),del=document.createElement('button');num.className='num';num.textContent=i+1;name.className='name';name.textContent=habit.name;edit.className='icon';edit.textContent='✎';edit.setAttribute('aria-label','Изменить '+habit.name);edit.onclick=()=>openForm(habit);del.className='icon del';del.textContent='✕';del.setAttribute('aria-label','Удалить '+habit.name);del.onclick=()=>{if(confirm('Удалить привычку «'+habit.name+'» и все её отметки?')){data.habits=data.habits.filter(x=>x.id!==habit.id);delete data.marks[habit.id];save();render()}};li.append(num,name,edit,del);h.append(li)});let done=0,days=Array.from({length:7},(_,i)=>dayAt(i));days.forEach(d=>{let el=document.createElement('div');el.className='day';let a=document.createElement('small');a.textContent=new Intl.DateTimeFormat('ru',{weekday:'short'}).format(d);let b=document.createElement('b');b.textContent=d.getDate();el.append(a,b);g.append(el)});data.habits.forEach(habit=>days.forEach(d=>{let k=dateKey(d),on=!!data.marks[habit.id]?.[k];if(on)done++;let cell=document.createElement('div'),b=document.createElement('button');cell.className='cell';b.className='check'+(on?' on':'');b.textContent=on?'✓':'';b.setAttribute('aria-label',habit.name+', '+d.toLocaleDateString('ru-RU'));b.setAttribute('aria-pressed',on);b.onclick=()=>{data.marks[habit.id]??={};data.marks[habit.id][k]=!on;save();render()};cell.append(b);g.append(cell)}));days.forEach(d=>{let n=data.habits.filter(x=>data.marks[x.id]?.[dateKey(d)]).length,el=document.createElement('div');el.className='summary';el.textContent=fmt(pct(n,data.habits.length));g.append(el)});let total=data.habits.length*7,p=pct(done,total);$('percentage').textContent=fmt(p);$('bar').style.width=p+'%';$('total').textContent=done+' из '+total+' выполнено';$('week').textContent=days[0].toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' — '+days[6].toLocaleDateString('ru-RU',{day:'numeric',month:'short'});let focus=dayAt(3);$('month').value=focus.getMonth();if(!$('year').querySelector('[value="'+focus.getFullYear()+'"]'))$('year').add(new Option(focus.getFullYear(),focus.getFullYear()));$('year').value=focus.getFullYear();$('foot').textContent=new Intl.DateTimeFormat('ru',{month:'long',year:'numeric'}).format(focus);requestAnimationFrame(fitBook)}function openForm(habit){editing=habit?.id||null;$('dialogTitle').textContent=habit?'Изменить привычку':'Новая привычка';$('habitInput').value=habit?.name||'';$('dialog').showModal();$('habitInput').focus()}$('add').onclick=()=>openForm();$('form').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;let name=$('habitInput').value.trim();if(!name){e.preventDefault();return}if(editing)data.habits.find(x=>x.id===editing).name=name;else data.habits.push({id:crypto.randomUUID(),name});save();render()});let turning=false;function move(n){if(turning)return;turning=true;const book=document.querySelector('.book'), sheet=document.createElement('div'),face=document.createElement('div'),back=document.createElement('div');sheet.className='turning-sheet '+(n>0?'forward':'backward');face.className='sheet-face';back.className='sheet-face sheet-back';const copy=(n>0?$('page'):document.querySelector('.left')).cloneNode(true);copy.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));copy.removeAttribute('id');face.append(copy);sheet.append(face,back);book.append(sheet);const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:900;setTimeout(()=>{current.setDate(current.getDate()+7*n);render()},duration/2);setTimeout(()=>{sheet.remove();turning=false;fitBook()},duration+20)}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{current=monday(new Date());render()};for(let i=0;i<12;i++)$('month').add(new Option(new Intl.DateTimeFormat('ru',{month:'long'}).format(new Date(2024,i,1)),i));for(let y=2000;y<=2100;y++)$('year').add(new Option(y,y));function changeDate(){current=monday(new Date(+$('year').value,+$('month').value,1));render()}$('month').onchange=changeDate;$('year').onchange=changeDate;render();function fitBook(){let book=document.querySelector('.book');book.style.setProperty('--fit',1);if(innerWidth<=800){alignRows();return}let scale=Math.min(1,(innerHeight*.90)/book.offsetHeight,(innerWidth*.94)/book.offsetWidth);book.style.setProperty('--fit',Math.max(.35,scale));alignRows()}function alignRows(){const nav=document.querySelector('.right .nav');nav.style.marginTop='0px';if(innerWidth<=800)return;const row=document.querySelector('.habits li'),cell=document.querySelector('.grid .cell');if(!row||!cell)return;const zoom=Number(getComputedStyle(document.querySelector('.book')).zoom)||1;nav.style.marginTop=Math.max(0,(row.getBoundingClientRect().top-cell.getBoundingClientRect().top)/zoom)+'px'}window.addEventListener('resize',fitBook);fitBook();
</script></body></html>
